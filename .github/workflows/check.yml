name: Application checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run check
